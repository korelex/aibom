name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
        exclude:
          # Python 3.9 is end-of-life and GitHub's current Ubuntu runner no longer provides it; it is still tested on
          # Windows, so the "requires-python >= 3.9" promise stays checked.
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  wheel:
    name: Wheel installs and scans (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      # Builds the wheel, installs it in a clean virtualenv and scans a small app with the installed `aibom`.
      # Catches data files that are missing from the package, which pytest on a checkout cannot see.
      - run: python scripts/smoke_wheel.py
