[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aibom"
version = "0.5.0"
description = "Find the AI models in a codebase, with proof."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Korelex" }]
requires-python = ">=3.9"
dependencies = [
    "cyclonedx-python-lib[validation]>=11",
    "jsonschema>=4",
    "packaging>=22",                        # Python requirement lines and versions, the standard way
    "PyYAML>=6",                            # pnpm-lock.yaml
    "tomli>=1.1; python_version < '3.11'",  # pyproject.toml and TOML lockfiles on Python 3.9 and 3.10
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/korelex/aibom"
Issues = "https://github.com/korelex/aibom/issues"

[project.scripts]
aibom = "aibom_engine.cli:main"

[tool.setuptools.packages.find]
include = ["aibom_engine*"]

[tool.setuptools.package-data]
aibom_engine = ["knowledge/*.json", "knowledge/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
