[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aibom"
version = "0.5.0"
description = "Find the AI models in a codebase, with proof."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cyclonedx-python-lib[validation]>=11",
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aibom = "aibom_engine.cli:main"

[tool.setuptools.packages.find]
include = ["aibom_engine*"]

[tool.setuptools.package-data]
aibom_engine = ["knowledge/*.json", "knowledge/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
